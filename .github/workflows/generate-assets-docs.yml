name: Generate Assets YAML and Markdown

on:
  push:
    branches:
      - main
    paths:
      - 'assets/json/**/*.json'
      - 'scripts/json_to_yaml.py'
      - 'scripts/yaml_to_markdown.py'
      - '.github/workflows/generate-assets-docs.yml'
  pull_request:
    paths:
      - 'assets/json/**/*.json'
      - 'scripts/json_to_yaml.py'
      - 'scripts/yaml_to_markdown.py'
      - '.github/workflows/generate-assets-docs.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Generate YAML from JSON
        run: |
          python scripts/json_to_yaml.py assets/json assets/yaml

      - name: Merge Object Types
        run: |
          python scripts/merge_object_types.py assets/yaml assets/yaml-merged

      - name: Generate Markdown from YAML
        run: |
          python scripts/yaml_to_markdown.py assets/yaml docs/assets

      - name: Show generated changes
        run: |
          git status --short

      - name: Commit generated files
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/yaml docs/assets

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Generate Assets YAML and Markdown"
          git push

